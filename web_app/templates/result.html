<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result - SQL Injection Detection</title>
    <!-- Three.js Library (required for Vanta.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    
    <!-- Vanta.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Vanta.js Background -->
    <div id="vanta-background"></div>
    
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo-container">
                <h1 class="logo">
                    <span class="logo-text">SQLi</span>
                    <span class="logo-accent">Detector</span>
                </h1>
            </div>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/statistics" class="nav-link">Statistics</a></li>
                <li><a href="/about" class="nav-link">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="result-page">
                <div class="page-hero">
                    <h2 class="page-title"><span class="typing-text">Analysis Result</span></h2>
                </div>
                <div id="resultContent" class="result-content">
                    <!-- Result will be displayed here via JavaScript -->
                </div>
                <div class="result-actions">
                    <a href="/" class="btn btn-primary">Analyze Another Query</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">
                &copy; 2025 SQL Injection Detection System. Powered by Machine Learning.
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Initialize Vanta.js
        VANTA.NET({
            el: "#vanta-background",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x797aff,
            backgroundColor: 0x0f0f0f,
            points: 20.00,
            maxDistance: 23.00,
            spacing: 20.00
        });
    </script>
    <script src="/static/js/typing.js"></script>
    <script src="/static/js/scroll-animations.js"></script>
    <script src="/static/js/scroll-progress.js"></script>
    <script src="/static/js/magnetic-buttons.js"></script>
    <script src="/static/js/card-3d-tilt.js"></script>
    <script src="/static/js/gradient-animation.js"></script>
    <script src="/static/js/progress-bar-animation.js"></script>
    <script src="/static/js/button-particles.js"></script>
    <script src="/static/js/navbar-scroll.js"></script>
    <script src="/static/js/reveal-text.js"></script>
    <script src="/static/js/parallax-effect.js"></script>
    <script src="/static/js/page-transitions.js"></script>
    <script src="/static/js/result.js"></script>
</body>
</html>
